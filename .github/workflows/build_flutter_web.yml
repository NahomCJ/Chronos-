name: Build Flutter Web for Vercel

on:
  push:
    branches: [main]
    paths:
      - 'chronos/lib/**'
      - 'chronos/pubspec.yaml'
      - 'chronos/pubspec.lock'
      - 'chronos/web/**'
      - 'chronos/assets/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: chronos
        run: flutter pub get

      - name: Build Flutter web
        working-directory: chronos
        run: flutter build web --release --no-tree-shake-icons

      - name: Commit web build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chronos/build/web/
          if git diff --staged --quiet; then
            echo "No changes to web build — skipping commit"
          else
            git commit -m "build: auto-rebuild Flutter web for Vercel [skip ci]"
            git push origin HEAD
          fi

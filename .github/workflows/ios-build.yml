name: iOS Flutter Build

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'chronos/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'chronos/**'
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: chronos
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: chronos/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('chronos/ios/Podfile', 'chronos/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        working-directory: chronos/ios
        run: pod install --repo-update

      - name: Build iOS release (unsigned)
        working-directory: chronos
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: Package as .ipa for AltStore
        run: |
          cd chronos/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ChronosBank.ipa Payload/
          echo "IPA_PATH=$(pwd)/ChronosBank.ipa" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronosBank-${{ github.run_number }}
          path: chronos/build/ios/iphoneos/ChronosBank.ipa
          retention-days: 30

name: iOS Flutter Build

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'chronos/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'chronos/**'
  workflow_dispatch:
    inputs:
      export_ipa:
        description: 'Export signed IPA (requires signing secrets)'
        required: false
        default: false
        type: boolean

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-ios:
    name: Build & Archive iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Print Flutter version
        working-directory: chronos
        run: flutter --version

      - name: Install Flutter dependencies
        working-directory: chronos
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: chronos/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('chronos/ios/Podfile', 'chronos/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        working-directory: chronos/ios
        run: pod install --repo-update

      - name: Analyze code
        working-directory: chronos
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run unit tests
        working-directory: chronos
        run: flutter test
        continue-on-error: true

      - name: Build iOS (unsigned release)
        working-directory: chronos
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      - name: Upload unsigned .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronos-bank-unsigned-${{ github.run_number }}
          path: chronos/build/ios/iphoneos/Runner.app
          retention-days: 7

      # ─── Code signing + IPA export (only when secrets exist) ───────────────
      - name: Check for signing secrets
        id: secrets
        run: |
          if [[ -n "${{ secrets.IOS_P12_CERTIFICATE_BASE64 }}" ]]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Import code-signing certificate
        if: steps.secrets.outputs.available == 'true'
        env:
          P12_CERTIFICATE_BASE64: ${{ secrets.IOS_P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASS=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH

          echo "$P12_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -k $KEYCHAIN_PATH \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild

          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" $KEYCHAIN_PATH

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> $GITHUB_ENV

      - name: Install provisioning profile
        if: steps.secrets.outputs.available == 'true'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print UUID' \
            /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/profile.mobileprovision)")

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Archive and export IPA
        if: steps.secrets.outputs.available == 'true'
        working-directory: chronos
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          ARCHIVE_PATH=$RUNNER_TEMP/Runner.xcarchive
          EXPORT_PATH=$RUNNER_TEMP/ipa

          # Generate ExportOptions.plist at build time so TEAM_ID is substituted
          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID"

      - name: Upload IPA artifact
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chronos-bank-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      - name: Clean up keychain
        if: always() && steps.secrets.outputs.available == 'true'
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

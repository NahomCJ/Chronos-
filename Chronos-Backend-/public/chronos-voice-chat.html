<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chronos Voice Chat</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #16202a;
        --muted: #66707c;
        --line: #d8dee6;
        --accent: #156c75;
        --accent-strong: #0f535a;
        --danger: #9b2c2c;
        --shadow: 0 16px 48px rgba(18, 29, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1080px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        gap: 16px;
        min-height: calc(100vh - 64px);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 8px;
        background: #16202a;
        color: #ffffff;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 22px;
        line-height: 1.2;
      }

      .subtitle {
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
      }

      .status {
        min-height: 44px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.4;
      }

      .status.error {
        border-color: #e2a9a9;
        color: var(--danger);
        background: #fff7f7;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      button {
        height: 44px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-strong);
      }

      button:disabled {
        cursor: not-allowed;
        background: #a8b3bd;
      }

      .secondary {
        background: #e9eef2;
        color: var(--ink);
      }

      .secondary:hover {
        background: #dce4ea;
      }

      textarea {
        width: 100%;
        min-height: 112px;
        resize: vertical;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        line-height: 1.4;
      }

      .chat {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        overflow: hidden;
      }

      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
      }

      .badge {
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 13px;
      }

      .messages {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 12px;
        padding: 20px;
        overflow-y: auto;
      }

      .message {
        width: min(78%, 720px);
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #ffffff;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .message.user {
        align-self: flex-end;
        border-color: #b8d7dc;
        background: #effafb;
      }

      .message.assistant {
        align-self: flex-start;
      }

      .empty {
        display: grid;
        flex: 1;
        place-items: center;
        color: var(--muted);
        text-align: center;
      }

      #widgetMount {
        display: none;
        padding: 20px;
        border-top: 1px solid var(--line);
      }

      #widgetMount.active {
        display: block;
      }

      @media (max-width: 820px) {
        main {
          width: min(100vw - 20px, 680px);
          padding: 10px 0;
        }

        .shell {
          grid-template-columns: 1fr;
          min-height: auto;
        }

        .chat {
          min-height: 520px;
        }

        .message {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <section class="panel controls" aria-label="Voice controls">
          <div class="brand">
            <div class="mark">C</div>
            <div>
              <h1>Chronos Voice</h1>
              <p class="subtitle">Talk to Chronos with ElevenLabs speech.</p>
            </div>
          </div>

          <div id="status" class="status">Ready.</div>

          <label for="tokenInput" class="subtitle">Chronos JWT (from login)</label>
          <textarea id="tokenInput" placeholder="Paste a Bearer token — every endpoint here requires auth" style="min-height: 60px"></textarea>
          <button id="saveTokenButton" class="secondary" type="button">Save Token</button>

          <div class="button-row">
            <button id="recordButton" type="button">Record</button>
            <button id="stopButton" class="secondary" type="button" disabled>Stop</button>
          </div>

          <textarea id="textInput" placeholder="Type a message for Chronos"></textarea>
          <button id="sendTextButton" type="button">Send Text</button>
          <button id="launchWidgetButton" class="secondary" type="button">Open ElevenLabs Agent</button>
        </section>

        <section class="panel chat" aria-label="Chronos conversation">
          <div class="chat-header">
            <div>
              <h2>Conversation</h2>
              <p class="subtitle">Voice transcripts and spoken replies appear here.</p>
            </div>
            <span id="modeBadge" class="badge">REST voice mode</span>
          </div>

          <div id="messages" class="messages">
            <div class="empty">Start recording or type a message.</div>
          </div>

          <div id="widgetMount"></div>
        </section>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById('status');
      const messagesEl = document.getElementById('messages');
      const recordButton = document.getElementById('recordButton');
      const stopButton = document.getElementById('stopButton');
      const sendTextButton = document.getElementById('sendTextButton');
      const launchWidgetButton = document.getElementById('launchWidgetButton');
      const textInput = document.getElementById('textInput');
      const tokenInput = document.getElementById('tokenInput');
      const saveTokenButton = document.getElementById('saveTokenButton');
      const widgetMount = document.getElementById('widgetMount');
      const modeBadge = document.getElementById('modeBadge');

      let mediaRecorder;
      let chunks = [];
      const history = [];
      const conversationId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());

      // Every /api/lifex/ai/voice/* route requires a valid Chronos JWT —
      // this page previously never sent one, so every call 401'd. Paste a
      // token from a real login response and it's kept in localStorage.
      tokenInput.value = localStorage.getItem('chronosToken') || '';
      saveTokenButton.addEventListener('click', () => {
        localStorage.setItem('chronosToken', tokenInput.value.trim());
        setStatus('Token saved.');
        loadConfig();
      });

      function authHeaders() {
        const token = localStorage.getItem('chronosToken');
        return token ? { Authorization: `Bearer ${token}` } : {};
      }

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle('error', isError);
      }

      function appendMessage(role, content) {
        const empty = messagesEl.querySelector('.empty');
        if (empty) {
          empty.remove();
        }

        const message = document.createElement('div');
        message.className = `message ${role}`;
        message.textContent = content;
        messagesEl.appendChild(message);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        history.push({ role, content });
      }

      async function postJson(url, body) {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify(body),
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || 'Voice chat request failed.');
        }

        return payload;
      }

      async function sendAudio(blob) {
        setStatus('Transcribing audio with ElevenLabs...');
        const audioDataUrl = await blobToDataUrl(blob);
        const result = await postJson('/api/lifex/ai/voice/audio', {
          audioDataUrl,
          mimeType: blob.type || 'audio/webm',
          fileName: 'chronos-recording.webm',
          conversationId,
          history,
        });

        appendMessage('user', result.transcript);
        appendMessage('assistant', result.reply);
        playAudio(result.audioBase64, result.audioMimeType);
        setStatus('Ready.');
      }

      async function sendText() {
        const message = textInput.value.trim();
        if (!message) {
          return;
        }

        textInput.value = '';
        appendMessage('user', message);
        setStatus('Generating Chronos reply...');

        const result = await postJson('/api/lifex/ai/voice/text', {
          message,
          conversationId,
          history,
        });

        appendMessage('assistant', result.reply);
        playAudio(result.audioBase64, result.audioMimeType);
        setStatus('Ready.');
      }

      function blobToDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(blob);
        });
      }

      function playAudio(audioBase64, mimeType) {
        const audio = new Audio(`data:${mimeType || 'audio/mpeg'};base64,${audioBase64}`);
        audio.play().catch(() => {
          setStatus('Reply audio is ready, but the browser blocked autoplay.', true);
        });
      }

      async function startRecording() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          chunks = [];
          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              chunks.push(event.data);
            }
          };

          mediaRecorder.onstop = () => {
            stream.getTracks().forEach((track) => track.stop());
            const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            sendAudio(blob).catch((error) => setStatus(error.message, true));
          };

          mediaRecorder.start();
          recordButton.disabled = true;
          stopButton.disabled = false;
          setStatus('Listening...');
        } catch (error) {
          setStatus(error.message || 'Microphone permission failed.', true);
        }
      }

      function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }

        recordButton.disabled = false;
        stopButton.disabled = true;
        setStatus('Processing recording...');
      }

      async function launchWidget() {
        try {
          setStatus('Preparing ElevenLabs agent...');
          const response = await fetch('/api/lifex/ai/voice/signed-url', { headers: authHeaders() });
          const payload = await response.json();

          if (!response.ok) {
            throw new Error(payload.error || 'Unable to create signed ElevenLabs URL.');
          }

          widgetMount.innerHTML = '';
          const widget = document.createElement('elevenlabs-convai');
          widget.setAttribute('signed-url', payload.signedUrl);
          widget.setAttribute('variant', 'expanded');
          widget.setAttribute('action-text', 'Talk to Chronos');
          widget.setAttribute('start-call-text', 'Start voice chat');
          widget.setAttribute('end-call-text', 'End');
          widgetMount.appendChild(widget);
          widgetMount.classList.add('active');
          modeBadge.textContent = 'ElevenLabs agent mode';
          await loadWidgetScript();
          setStatus('ElevenLabs agent ready.');
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      function loadWidgetScript() {
        return new Promise((resolve, reject) => {
          if (document.querySelector('script[data-elevenlabs-widget]')) {
            resolve();
            return;
          }

          const script = document.createElement('script');
          script.src = 'https://unpkg.com/@elevenlabs/convai-widget-embed';
          script.async = true;
          script.type = 'text/javascript';
          script.dataset.elevenlabsWidget = 'true';
          script.onload = resolve;
          script.onerror = () => reject(new Error('Failed to load ElevenLabs widget script.'));
          document.body.appendChild(script);
        });
      }

      recordButton.addEventListener('click', startRecording);
      stopButton.addEventListener('click', stopRecording);
      sendTextButton.addEventListener('click', () => {
        sendText().catch((error) => setStatus(error.message, true));
      });
      launchWidgetButton.addEventListener('click', launchWidget);

      function loadConfig() {
        fetch('/api/lifex/ai/voice/config', { headers: authHeaders() })
          .then((response) => {
            if (response.status === 401) {
              throw new Error('Paste a Chronos JWT above and click Save Token.');
            }
            return response.json();
          })
          .then((config) => {
            if (!config.agentConfigured) {
              launchWidgetButton.disabled = true;
            }

            if (!config.elevenLabsConfigured) {
              setStatus('Set ELEVENLABS_API_KEY before using voice chat.', true);
            }
          })
          .catch((error) => {
            setStatus(error.message || 'Voice route is not mounted yet.', true);
          });
      }

      loadConfig();
    </script>
  </body>
</html>
